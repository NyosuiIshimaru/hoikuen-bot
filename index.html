<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>保育園持ち物</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 100%;
      margin: 0 auto;

      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 5px 0 12px;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .item {
      background: white;
      padding: 9px 12px;
      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label {
      font-size: 17px;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 75px;
      height: 40px;

      font-size: 20px;
      text-align: center;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .unit {
      font-size: 16px;
      margin-left: 5px;
    }

    .other {
      background: white;
      padding: 9px 12px;
      margin-top: 7px;
      border-radius: 8px;
    }

    .other label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      height: 40px;

      font-size: 17px;
      padding: 5px 8px;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      height: 48px;

      margin-top: 10px;

      font-size: 18px;
      font-weight: bold;

      border: none;
      border-radius: 8px;

      background: #06c755;
      color: white;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .message {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏫 保育園の持ち物</h1>

    <div class="items">

      <!-- シャツ -->
      <div class="item">
        <label>シャツ</label>

        <div class="input-area">
          <input
            id="shirts"
            type="number"
            min="0"
            inputmode="numeric"
            value="0"
          >
          <span class="unit">枚</span>
        </div>
      </div>

      <!-- 肌着 -->
      <div class="item">
        <label>肌着</label>

        <div class="input-area">
          <input
            id="underwear"
            type="number"
            min="0"
            inputmode="numeric"
            value="0"
          >
          <span class="unit">枚</span>
        </div>
      </div>

      <!-- ズボン -->
      <div class="item">
        <label>ズボン</label>

        <div class="input-area">
          <input
            id="pants"
            type="number"
            min="0"
            inputmode="numeric"
            value="0"
          >
          <span class="unit">枚</span>
        </div>
      </div>

      <!-- おむつ -->
      <div class="item">
        <label>おむつ（残り）</label>

        <div class="input-area">
          <input
            id="diapers"
            type="number"
            min="0"
            inputmode="numeric"
            value="0"
          >
          <span class="unit">枚</span>
        </div>
      </div>

    </div>

    <!-- その他 -->
    <div class="other">

      <label>その他</label>

      <input
        id="other"
        type="text"
        placeholder="例：帽子、タオル"
      >

    </div>

    <!-- 送信 -->
    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      LINEに送信
    </button>

    <div class="message">
      入力した内容を指定のLINEへ送信します
    </div>

  </div>


  <script>

    // =========================
    // LIFF ID
    // =========================

    const LIFF_ID = "2011343562-RUScNWDu";


    // =========================
    // GAS WebアプリURL
    // =========================
    //
    // ★現在使用しているGAS URLを入れてください
    //

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzF4kgOUhXYbaOeon0E_7hQ9Y5VxgWJkLVWrPLDdjwywathsHVLkZAIoi1wzgXmQfM/exec";


    // =========================
    // LIFF初期化
    // =========================

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        console.log(
          "LIFF initialization succeeded"
        );

      } catch (error) {

        console.error(error);

        alert(
          "LINEの初期化に失敗しました。"
        );
      }
    }


    // =========================
    // LINE送信
    // =========================

    async function sendMessage() {

      const button =
        document.getElementById("sendButton");


      // 二重送信防止

      button.disabled = true;
      button.textContent = "送信中...";


      // =========================
      // 入力値
      // =========================

      const shirts =
        document.getElementById("shirts").value;

      const underwear =
        document.getElementById("underwear").value;

      const pants =
        document.getElementById("pants").value;

      const diapers =
        document.getElementById("diapers").value;

      const other =
        document.getElementById("other").value;


      // =========================
      // メッセージ作成
      // =========================

      const message =
`【保育園の持ち物】

シャツ　${shirts}枚
肌着　${underwear}枚
ズボン　${pants}枚
おむつ　残${diapers}枚

その他
${other || "なし"}`;


      try {

        // =========================
        // GASへ送信
        // =========================

        const formData =
          new URLSearchParams();

        formData.append(
          "message",
          message
        );


        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",
              body: formData
            }
          );


        const result =
          await response.text();


        console.log(
          "GAS response:",
          result
        );


        if (
          result.startsWith("ERROR")
        ) {
          throw new Error(result);
        }


        // =========================
        // 成功
        // =========================

        alert(
          "送信しました！"
        );


        // 入力をリセット

        document.getElementById(
          "shirts"
        ).value = 0;

        document.getElementById(
          "underwear"
        ).value = 0;

        document.getElementById(
          "pants"
        ).value = 0;

        document.getElementById(
          "diapers"
        ).value = 0;

        document.getElementById(
          "other"
        ).value = "";


      } catch (error) {

        console.error(error);

        alert(
          "送信できませんでした。\n" +
          "通信状態やGASの設定を確認してください。"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "LINEに送信";
      }
    }


    // =========================
    // 開始
    // =========================

    main();

  </script>

</body>
</html>
