<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>保育園持ち物</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", sans-serif;

      background: #f5f5f5;

      /* LINE上部の表示領域を考慮 */
      padding: 6px 10px 8px;

      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* タイトル */
    h1 {
      text-align: center;
      font-size: 20px;
      line-height: 1.2;

      margin: 3px 0 8px;
    }

    /* 入力項目 */
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;

      height: 48px;

      padding: 5px 10px;

      margin-bottom: 5px;

      border-radius: 8px;
    }

    .item label {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
    }

    .input-area {
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 65px;
      height: 36px;

      padding: 0;

      font-size: 19px;
      text-align: center;

      border: 1px solid #ccc;
      border-radius: 6px;

      background: white;
    }

    .unit {
      font-size: 15px;
      margin-left: 4px;
    }

    /* その他 */
    .other {
      display: flex;
      align-items: center;

      background: white;

      height: 48px;

      padding: 5px 10px;

      margin-top: 5px;

      border-radius: 8px;
    }

    .other label {
      width: 55px;

      font-size: 16px;
      font-weight: bold;

      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;

      min-width: 0;

      height: 36px;

      padding: 4px 8px;

      font-size: 16px;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* 送信ボタン */
    button {
      display: block;

      width: 100%;
      height: 46px;

      margin-top: 8px;

      padding: 0;

      font-size: 17px;
      font-weight: bold;

      border: none;
      border-radius: 8px;

      background: #06c755;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    /* 説明 */
    .message {
      text-align: center;

      font-size: 11px;
      line-height: 1.2;

      color: #777;

      margin-top: 4px;
    }

    /* 小さいスマホ用 */
    @media (max-height: 650px) {

      body {
        padding-top: 3px;
        padding-bottom: 4px;
      }

      h1 {
        font-size: 18px;
        margin: 2px 0 5px;
      }

      .item {
        height: 43px;
        margin-bottom: 4px;
      }

      .other {
        height: 43px;
        margin-top: 4px;
      }

      input[type="number"],
      input[type="text"] {
        height: 32px;
      }

      button {
        height: 42px;
        margin-top: 6px;
      }

      .message {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏫 保育園の持ち物</h1>

    <!-- シャツ -->
    <div class="item">

      <label>シャツ</label>

      <div class="input-area">

        <input
          id="shirts"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- 肌着 -->
    <div class="item">

      <label>肌着</label>

      <div class="input-area">

        <input
          id="underwear"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- ズボン -->
    <div class="item">

      <label>ズボン</label>

      <div class="input-area">

        <input
          id="pants"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- おむつ -->
    <div class="item">

      <label>おむつ（残り）</label>

      <div class="input-area">

        <input
          id="diapers"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- その他 -->
    <div class="other">

      <label>その他</label>

      <input
        id="other"
        type="text"
        placeholder="例：帽子、タオル"
      >

    </div>


    <!-- 送信ボタン -->
    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      LINEに送信
    </button>


    <div class="message">
      入力した内容を指定のLINEへ送信します
    </div>

  </div>


  <script>

    // =========================
    // LIFF ID
    // =========================

    const LIFF_ID =
      "2011343562-RUScNWDu";


    // =========================
    // GAS WebアプリURL
    // =========================
    //
    // ★ここは現在使用しているURLを
    // そのまま入れてください。
    //

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzF4kgOUhXYbaOeon0E_7hQ9Y5VxgWJkLVWrPLDdjwywathsHVLkZAIoi1wzgXmQfM/exec";


    // =========================
    // LIFF初期化
    // =========================

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        console.log(
          "LIFF initialization succeeded"
        );

      } catch (error) {

        console.error(error);

        alert(
          "LINEの初期化に失敗しました。"
        );

      }

    }


    // =========================
    // 送信
    // =========================

    async function sendMessage() {

      const button =
        document.getElementById("sendButton");


      // 二重送信防止

      button.disabled = true;
      button.textContent = "送信中...";


      // =========================
      // 数字取得
      // =========================

      const shirts =
        document.getElementById("shirts").value;

      const underwear =
        document.getElementById("underwear").value;

      const pants =
        document.getElementById("pants").value;

      const diapers =
        document.getElementById("diapers").value;

      const other =
        document.getElementById("other").value;


      // =========================
      // LINEメッセージ作成
      // =========================

      const message =
`【保育園の持ち物】

シャツ　${shirts}枚
肌着　${underwear}枚
ズボン　${pants}枚
おむつ　残${diapers}枚

その他
${other || "なし"}`;


      try {

        const formData =
          new URLSearchParams();

        formData.append(
          "message",
          message
        );


        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",
              body: formData
            }
          );


        const result =
          await response.text();


        console.log(
          "GAS response:",
          result
        );


        if (
          result.startsWith("ERROR")
        ) {

          throw new Error(result);

        }


        // =========================
        // 成功
        // =========================

        alert(
          "送信しました！"
        );


        // 入力リセット

        document.getElementById(
          "shirts"
        ).value = 0;

        document.getElementById(
          "underwear"
        ).value = 0;

        document.getElementById(
          "pants"
        ).value = 0;

        document.getElementById(
          "diapers"
        ).value = 0;

        document.getElementById(
          "other"
        ).value = "";


      } catch (error) {

        console.error(error);

        alert(
          "送信できませんでした。\n" +
          "通信状態を確認してください。"
        );

      } finally {

        button.disabled = false;
        button.textContent = "LINEに送信";

      }

    }


    // =========================
    // 起動
    // =========================

    main();

  </script>

</body>
</html>
