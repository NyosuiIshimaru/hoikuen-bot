<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>保育園持ち物</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", sans-serif;

      background: #f5f5f5;

      padding: 6px 6px 8px;

      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: none;
      margin: 0 auto;
    }

    /* タイトル */
    h1 {
      text-align: center;
      font-size: 20px;
      line-height: 1.2;

      margin: 3px 0 8px;
    }

    /* 項目 */
    .item {
      background: white;

      padding: 7px 8px;

      margin-bottom: 5px;

      border-radius: 8px;
    }

    .item-label {
      display: block;

      font-size: 16px;
      font-weight: bold;

      margin-bottom: 6px;
    }

    /* 枚数ボタン */
    .count-buttons {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 6px;

      width: 100%;
    }

    .count-button {
      height: 40px;

      padding: 0;

      font-size: 15px;
      font-weight: bold;

      border: 1px solid #ccc;
      border-radius: 6px;

      background: #fff;
      color: #333;

      cursor: pointer;

      margin: 0;
    }

    .count-button.selected {
      background: #06c755;
      border-color: #06c755;
      color: white;
    }

    /* おむつ */
    .diaper-area {
      display: flex;
      align-items: center;

      gap: 6px;
    }

    .diaper-choice {
      height: 40px;

      flex: 1;

      padding: 0;

      font-size: 15px;
      font-weight: bold;

      border: 1px solid #ccc;
      border-radius: 6px;

      background: white;
      color: #333;

      margin: 0;
    }

    .diaper-choice.selected {
      background: #06c755;
      border-color: #06c755;
      color: white;
    }

    #diaperNumberArea {
      display: none;

      align-items: center;

      gap: 4px;
    }

    #diaperNumber {
      width: 65px;
      height: 40px;

      padding: 0;

      font-size: 18px;
      text-align: center;

      border: 1px solid #ccc;
      border-radius: 6px;

      background: white;
    }

    .unit {
      font-size: 14px;
    }

    /* その他 */
    .other {
      display: flex;
      align-items: center;

      background: white;

      min-height: 48px;

      padding: 6px 8px;

      margin-top: 5px;

      border-radius: 8px;
    }

    .other label {
      width: 55px;

      font-size: 16px;
      font-weight: bold;

      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;

      min-width: 0;

      height: 36px;

      padding: 4px 8px;

      font-size: 16px;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* 送信ボタン */
    #sendButton {
      display: block;

      width: 100%;
      height: 46px;

      margin-top: 8px;

      padding: 0;

      font-size: 17px;
      font-weight: bold;

      border: none;
      border-radius: 8px;

      background: #06c755;
      color: white;

      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    /* 説明 */
    .message {
      text-align: center;

      font-size: 11px;
      line-height: 1.2;

      color: #777;

      margin-top: 4px;
    }

    /* 小さいスマホ用 */
    @media (max-height: 650px) {

      body {
        padding-top: 3px;
        padding-bottom: 4px;
      }

      h1 {
        font-size: 18px;
        margin: 2px 0 5px;
      }

      .item {
        padding: 5px 7px;
        margin-bottom: 4px;
      }

      .item-label {
        margin-bottom: 4px;
        font-size: 15px;
      }

      .count-button,
      .diaper-choice {
        height: 34px;
        font-size: 14px;
      }

      #diaperNumber {
        height: 34px;
      }

      .other {
        min-height: 40px;
        margin-top: 4px;
      }

      input[type="text"] {
        height: 32px;
      }

      #sendButton {
        height: 42px;
        margin-top: 6px;
      }

      .message {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏫 保育園の持ち物</h1>


    <!-- シャツ -->
    <div class="item">

      <span class="item-label">シャツ</span>

      <div class="count-buttons">

        <button class="count-button selected"
                data-item="shirts"
                data-value="なし"
                onclick="selectCount(this)">
          なし
        </button>

        <button class="count-button"
                data-item="shirts"
                data-value="1"
                onclick="selectCount(this)">
          1枚
        </button>

        <button class="count-button"
                data-item="shirts"
                data-value="2"
                onclick="selectCount(this)">
          2枚
        </button>

        <button class="count-button"
                data-item="shirts"
                data-value="3"
                onclick="selectCount(this)">
          3枚
        </button>

      </div>

    </div>


    <!-- 肌着 -->
    <div class="item">

      <span class="item-label">肌着</span>

      <div class="count-buttons">

        <button class="count-button selected"
                data-item="underwear"
                data-value="なし"
                onclick="selectCount(this)">
          なし
        </button>

        <button class="count-button"
                data-item="underwear"
                data-value="1"
                onclick="selectCount(this)">
          1枚
        </button>

        <button class="count-button"
                data-item="underwear"
                data-value="2"
                onclick="selectCount(this)">
          2枚
        </button>

        <button class="count-button"
                data-item="underwear"
                data-value="3"
                onclick="selectCount(this)">
          3枚
        </button>

      </div>

    </div>


    <!-- ズボン -->
    <div class="item">

      <span class="item-label">ズボン</span>

      <div class="count-buttons">

        <button class="count-button selected"
                data-item="pants"
                data-value="なし"
                onclick="selectCount(this)">
          なし
        </button>

        <button class="count-button"
                data-item="pants"
                data-value="1"
                onclick="selectCount(this)">
          1枚
        </button>

        <button class="count-button"
                data-item="pants"
                data-value="2"
                onclick="selectCount(this)">
          2枚
        </button>

        <button class="count-button"
                data-item="pants"
                data-value="3"
                onclick="selectCount(this)">
          3枚
        </button>

      </div>

    </div>


    <!-- おむつ -->
    <div class="item">

      <span class="item-label">おむつ（残り）</span>

      <div class="diaper-area">

        <!-- 初期状態：不要 -->
        <button
          id="diaperNone"
          class="diaper-choice selected"
          onclick="selectDiaper('none')">
          不要
        </button>

        <button
          id="diaperNeed"
          class="diaper-choice"
          onclick="selectDiaper('need')">
          必要
        </button>

        <div id="diaperNumberArea">

          <input
            id="diaperNumber"
            type="number"
            min="0"
            inputmode="numeric"
            value="0"
          >

          <span class="unit">枚</span>

        </div>

      </div>

    </div>


    <!-- その他 -->
    <div class="other">

      <label>その他</label>

      <input
        id="other"
        type="text"
        placeholder="例：帽子、タオル"
      >

    </div>


    <!-- 送信ボタン -->
    <button
      id="sendButton"
      onclick="sendMessage()">
      LINEに送信
    </button>


    <div class="message">
      入力した内容を指定のLINEへ送信します
    </div>

  </div>


  <script>

    // =========================
    // LIFF ID
    // =========================

    const LIFF_ID =
      "2011343562-RUScNWDu";


    // =========================
    // GAS WebアプリURL
    // =========================

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzF4kgOUhXYbaOeon0E_7hQ9Y5VxgWJkLVWrPLDdjwywathsHVLkZAIoi1wzgXmQfM/exec";


    // =========================
    // 選択した枚数
    // =========================

    const counts = {
      shirts: "なし",
      underwear: "なし",
      pants: "なし"
    };


    // =========================
    // 枚数ボタン選択
    // =========================

    function selectCount(button) {

      const item =
        button.dataset.item;

      const value =
        button.dataset.value;


      // 値を保存

      counts[item] = value;


      // 同じ項目のボタンを取得

      const buttons =
        document.querySelectorAll(
          `.count-button[data-item="${item}"]`
        );


      // 選択状態をリセット

      buttons.forEach(btn => {

        btn.classList.remove(
          "selected"
        );

      });


      // 押したボタンを選択状態

      button.classList.add(
        "selected"
      );

    }


    // =========================
    // おむつ選択
    // =========================

    function selectDiaper(type) {

      const noneButton =
        document.getElementById(
          "diaperNone"
        );

      const needButton =
        document.getElementById(
          "diaperNeed"
        );

      const numberArea =
        document.getElementById(
          "diaperNumberArea"
        );


      if (type === "none") {

        noneButton.classList.add(
          "selected"
        );

        needButton.classList.remove(
          "selected"
        );

        numberArea.style.display =
          "none";

      }


      if (type === "need") {

        noneButton.classList.remove(
          "selected"
        );

        needButton.classList.add(
          "selected"
        );

        numberArea.style.display =
          "flex";

      }

    }


    // =========================
    // LIFF初期化
    // =========================

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        console.log(
          "LIFF initialization succeeded"
        );

      } catch (error) {

        console.error(error);

        alert(
          "LINEの初期化に失敗しました。"
        );

      }

    }


    // =========================
    // 送信
    // =========================

    ```javascript
async function sendMessage() {

  const button =
    document.getElementById("sendButton");

  button.disabled = true;
  button.textContent = "送信中...";


  // =========================
  // 数量取得
  // =========================

  const shirts =
    counts.shirts;

  const underwear =
    counts.underwear;

  const pants =
    counts.pants;


  // =========================
  // おむつ取得
  // =========================

  const diaperNeed =
    document
      .getElementById("diaperNeed")
      .classList
      .contains("selected");


  let diapers;

  if (diaperNeed) {

    diapers =
      document.getElementById(
        "diaperNumber"
      ).value || 0;

  } else {

    diapers = "不要";

  }


  // =========================
  // その他
  // =========================

  const other =
    document.getElementById("other").value;


  // =========================
  // メッセージ作成
  // =========================

  const message =
`【保育園の持ち物】

シャツ　${shirts === "なし" ? "なし" : shirts + "枚"}
肌着　${underwear === "なし" ? "なし" : underwear + "枚"}
ズボン　${pants === "なし" ? "なし" : pants + "枚"}
おむつ　${diaperNeed ? "残" + diapers + "枚" : "不要"}

その他
${other || "なし"}`;


  console.log(
    "送信メッセージ:",
    message
  );


  try {

    // =========================
    // GASへ送信
    // =========================

    const formData =
      new URLSearchParams();

    formData.append(
      "message",
      message
    );


    /*
     * GASのレスポンスを
     * ブラウザ側で待たない方式
     *
     * mode: "no-cors"
     */

    await fetch(
      GAS_URL,
      {
        method: "POST",
        mode: "no-cors",
        body: formData
      }
    );


    // =========================
    // 成功
    // =========================

    alert(
      "送信しました！"
    );


    resetForm();


  } catch (error) {

    console.error(
      "送信エラー:",
      error
    );

    alert(
      "送信できませんでした。\n" +
      "通信状態を確認してください。"
    );


  } finally {

    button.disabled = false;

    button.textContent =
      "LINEに送信";

  }

}
```



    // =========================
    // フォームリセット
    // =========================

    function resetForm() {

      // シャツ・肌着・ズボンを
      // 「なし」に戻す

      counts.shirts = "なし";
      counts.underwear = "なし";
      counts.pants = "なし";


      document
        .querySelectorAll(".count-button")
        .forEach(button => {

          button.classList.remove(
            "selected"
          );


          if (
            button.dataset.value === "なし"
          ) {

            button.classList.add(
              "selected"
            );

          }

        });


      // おむつを「不要」に戻す

      selectDiaper("none");


      document.getElementById(
        "diaperNumber"
      ).value = 0;


      // その他をクリア

      document.getElementById(
        "other"
      ).value = "";

    }


    // =========================
    // 起動
    // =========================

    main();

  </script>

</body>
</html>
