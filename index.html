<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>持ち物</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", sans-serif;

      background: #f5f5f5;

      padding: 4px 8px;

      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* 各項目 */
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;

      height: 45px;

      background: #fff;

      padding: 4px 10px;

      margin-bottom: 4px;

      border-radius: 7px;
    }

    .item label {
      font-size: 16px;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 65px;
      height: 34px;

      padding: 0;

      font-size: 18px;
      text-align: center;

      border: 1px solid #ccc;
      border-radius: 6px;

      background: #fff;
    }

    .unit {
      font-size: 15px;
      margin-left: 4px;
    }

    /* その他 */
    .other {
      display: flex;
      align-items: center;

      height: 45px;

      background: #fff;

      padding: 4px 10px;

      margin-bottom: 5px;

      border-radius: 7px;
    }

    .other label {
      width: 55px;

      font-size: 16px;
      font-weight: bold;

      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;

      min-width: 0;

      height: 34px;

      padding: 3px 7px;

      font-size: 16px;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* 送信ボタン */
    button {
      width: 100%;
      height: 44px;

      padding: 0;

      font-size: 17px;
      font-weight: bold;

      border: none;
      border-radius: 7px;

      background: #06c755;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- シャツ -->
    <div class="item">

      <label>シャツ</label>

      <div class="input-area">

        <input
          id="shirts"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- 肌着 -->
    <div class="item">

      <label>肌着</label>

      <div class="input-area">

        <input
          id="underwear"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- ズボン -->
    <div class="item">

      <label>ズボン</label>

      <div class="input-area">

        <input
          id="pants"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- おむつ -->
    <div class="item">

      <label>おむつ（残り）</label>

      <div class="input-area">

        <input
          id="diapers"
          type="number"
          min="0"
          inputmode="numeric"
          value="0"
        >

        <span class="unit">枚</span>

      </div>

    </div>


    <!-- その他 -->
    <div class="other">

      <label>その他</label>

      <input
        id="other"
        type="text"
        placeholder="例：帽子、タオル"
      >

    </div>


    <!-- 送信 -->
    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      LINEに送信
    </button>

  </div>


  <script>

    // =========================
    // LIFF ID
    // =========================

    const LIFF_ID =
      "2011343562-RUScNWDu";


    // =========================
    // GAS WebアプリURL
    // =========================
    //
    // ★現在使用しているGAS URLを入れてください
    //

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzF4kgOUhXYbaOeon0E_7hQ9Y5VxgWJkLVWrPLDdjwywathsHVLkZAIoi1wzgXmQfM/exec";


    // =========================
    // LIFF初期化
    // =========================

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        console.log(
          "LIFF initialization succeeded"
        );

      } catch (error) {

        console.error(error);

      }

    }


    // =========================
    // 送信
    // =========================

    async function sendMessage() {

      const button =
        document.getElementById("sendButton");

      button.disabled = true;
      button.textContent = "送信中...";


      // 入力値

      const shirts =
        document.getElementById("shirts").value;

      const underwear =
        document.getElementById("underwear").value;

      const pants =
        document.getElementById("pants").value;

      const diapers =
        document.getElementById("diapers").value;

      const other =
        document.getElementById("other").value;


      // メッセージ

      const message =
`【保育園の持ち物】

シャツ　${shirts}枚
肌着　${underwear}枚
ズボン　${pants}枚
おむつ　残${diapers}枚

その他
${other || "なし"}`;


      try {

        const formData =
          new URLSearchParams();

        formData.append(
          "message",
          message
        );


        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",
              body: formData
            }
          );


        const result =
          await response.text();


        console.log(
          "GAS response:",
          result
        );


        if (
          result.startsWith("ERROR")
        ) {
          throw new Error(result);
        }


        alert("送信しました！");


        // リセット

        document.getElementById(
          "shirts"
        ).value = 0;

        document.getElementById(
          "underwear"
        ).value = 0;

        document.getElementById(
          "pants"
        ).value = 0;

        document.getElementById(
          "diapers"
        ).value = 0;

        document.getElementById(
          "other"
        ).value = "";


      } catch (error) {

        console.error(error);

        alert(
          "送信できませんでした。\n" +
          "通信状態を確認してください。"
        );

      } finally {

        button.disabled = false;
        button.textContent = "LINEに送信";

      }

    }


    main();

  </script>

</body>
</html>
