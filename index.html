<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>保育園持ち物</title>

  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .item {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    label {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="number"] {
      font-size: 20px;
      padding: 8px;
      width: 100px;
      box-sizing: border-box;
    }

    input[type="text"] {
      font-size: 18px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .unit {
      font-size: 18px;
      margin-left: 5px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #06c755;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <h1>🏫 保育園の持ち物</h1>

  <!-- シャツ -->
  <div class="item">
    <label>シャツ</label>
    <input id="shirts" type="number" min="0" value="0">
    <span class="unit">枚</span>
  </div>

  <!-- 肌着 -->
  <div class="item">
    <label>肌着</label>
    <input id="underwear" type="number" min="0" value="0">
    <span class="unit">枚</span>
  </div>

  <!-- ズボン -->
  <div class="item">
    <label>ズボン</label>
    <input id="pants" type="number" min="0" value="0">
    <span class="unit">枚</span>
  </div>

  <!-- おむつ -->
  <div class="item">
    <label>おむつ（残り）</label>
    <input id="diapers" type="number" min="0" value="0">
    <span class="unit">枚</span>
  </div>

  <!-- その他 -->
  <div class="item">
    <label>その他</label>
    <input
      id="other"
      type="text"
      placeholder="例：帽子、タオル"
    >
  </div>

  <!-- 送信ボタン -->
  <button id="sendButton" onclick="sendMessage()">
    LINEに送信
  </button>


  <script>

    // =========================
    // LINE LIFF
    // =========================

    const LIFF_ID = "2011343562-RUScNWDu";


    // =========================
    // GAS WebアプリURL
    // =========================
    //
    // ★ここを自分のGAS URLに変更してください
    //
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzF4kgOUhXYbaOeon0E_7hQ9Y5VxgWJkLVWrPLDdjwywathsHVLkZAIoi1wzgXmQfM/exec";


    // =========================
    // LIFFを起動
    // =========================

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        console.log("LIFF initialization succeeded");

      } catch (error) {

        console.error(
          "LIFF initialization failed:",
          error
        );

        alert(
          "LINEアプリの初期化に失敗しました。"
        );
      }
    }


    // =========================
    // GAS経由でLINEへ送信
    // =========================

    async function sendMessage() {

      const button =
        document.getElementById("sendButton");

      // 二重送信防止
      button.disabled = true;
      button.textContent = "送信中...";


      // =========================
      // 入力値を取得
      // =========================

      const shirts =
        document.getElementById("shirts").value;

      const underwear =
        document.getElementById("underwear").value;

      const pants =
        document.getElementById("pants").value;

      const diapers =
        document.getElementById("diapers").value;

      const other =
        document.getElementById("other").value;


      // =========================
      // 送信する文章
      // =========================

      const message =
`【保育園の持ち物】

シャツ　${shirts}枚
肌着　${underwear}枚
ズボン　${pants}枚
おむつ　残${diapers}枚

その他
${other || "なし"}`;


      try {

        // =========================
        // GASへ送信
        // =========================

        const formData = new URLSearchParams();

        formData.append(
          "message",
          message
        );


        await fetch(
          GAS_URL,
          {
            method: "POST",
            body: formData
          }
        );


        alert(
          "送信しました！"
        );


        // 入力をリセット
        document.getElementById("shirts").value = 0;
        document.getElementById("underwear").value = 0;
        document.getElementById("pants").value = 0;
        document.getElementById("diapers").value = 0;
        document.getElementById("other").value = "";


      } catch (error) {

        console.error(error);

        alert(
          "送信できませんでした。\n" +
          "通信状態を確認してください。"
        );

      } finally {

        button.disabled = false;
        button.textContent = "LINEに送信";
      }
    }


    // =========================
    // 開始
    // =========================

    main();

  </script>

</body>
</html>
